name: Valider et publier

# Le site n'est publié que si contenus.json passe la validation : un fichier
# cassé reste sur GitHub, mais les téléphones gardent la version précédente.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une seule publication à la fois ; la plus récente gagne.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node valider.mjs

  publier:
    needs: valider
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Tout le dépôt est publié, sauf l'outillage (git, CI, validateur, README).
      - run: rsync -a --exclude='.git*' --exclude='.github' --exclude='valider.mjs' --exclude='README.md' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
